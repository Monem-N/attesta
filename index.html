<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b23a2b">
<meta name="description" content="Attesta — attestation de contrôle conforme pour la Wallonie, la Flandre et Bruxelles.">
<title>Attesta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f3ee'/%3E%3Cpath d='M6 9h20M6 16h20M6 23h20' stroke='%23b23a2b' stroke-width='2'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="rule" id="rule"></div>
    <div class="head-row">
      <div class="brand">ATTESTA</div>
      <div class="head-region">
        <div class="region" id="regionLabel">—</div>
        <button type="button" class="change-region" id="changeRegion" hidden>Change region</button>
      </div>
    </div>
    <div class="progress" id="progress" aria-label="Progress"></div>
    <div class="step-count" id="stepCount"></div>
  </header>

  <main class="stage">
    <div class="step-head">
      <h1 id="stepTitle"></h1>
      <p id="stepHint"></p>
    </div>
    <div id="warning" hidden></div>
    <form id="form" class="fields" autocomplete="off"></form>
    <noscript>Attesta requires JavaScript to complete the wizard and generate documents.</noscript>
  </main>

  <footer class="foot">
    <button type="button" class="btn back" id="back">Back</button>
    <div class="due" id="due" hidden>
      <span class="due-label" id="dueLabel">NEXT CONTROL</span>
      <strong id="dueDate">—</strong>
    </div>
    <button type="button" class="btn next" id="next">Continue</button>
  </footer>
</div>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
