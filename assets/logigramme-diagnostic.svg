<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
<defs>
  <style>
    .bg{fill:#fff}
    .panel{fill:#fff;stroke:#d7dee8;stroke-width:2}
    .h1{font:700 34px Roboto,sans-serif;fill:#13243a}
    .h2{font:700 24px Roboto,sans-serif;fill:#13243a}
    .sub{font:400 17px Roboto,sans-serif;fill:#5c6b7d}
    .node{fill:#fff;stroke:#26384d;stroke-width:2.4}
    .decision{fill:#fff;stroke:#26384d;stroke-width:2.4}
    .green{fill:#dcefd8;stroke:#4b7d45;stroke-width:2.2}
    .yellow{fill:#fff4b8;stroke:#b69b2d;stroke-width:2.2}
    .pink{fill:#f4c3dc;stroke:#b04c82;stroke-width:2.2}
    .blue{fill:#c8e9f0;stroke:#3f8999;stroke-width:2.2}
    .text{font:17px Roboto,sans-serif;fill:#17283c;text-anchor:middle}
    .small{font:15px Roboto,sans-serif;fill:#17283c;text-anchor:middle}
    .tiny{font:14px Roboto,sans-serif;fill:#425268}
    .edge{fill:none;stroke:#33465c;stroke-width:2.4;marker-end:url(#arrow)}
    .edge2{fill:none;stroke:#33465c;stroke-width:2.4}
    .label{font:700 16px Roboto,sans-serif;fill:#26384d}
    .note{font:15px Roboto,sans-serif;fill:#34465b}
    .pill{font:700 14px Roboto,sans-serif;fill:#fff;text-anchor:middle}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#33465c"/>
  </marker>
</defs>
<rect class="bg" width="1800" height="1150"/>
<g transform="translate(0,-2080)">
<!-- PANEL 2 -->
<rect class="panel" x="60" y="2080" width="1680" height="1140" rx="0"/>
<text x="100" y="2140" class="h2">2. Logigramme relatif au diagnostic approfondi</text>
<text x="100" y="2170" class="sub">Reconstitution du schéma de la page 10, avec les conditions et issues décrites dans le document</text>

<rect class="node" x="770" y="2220" width="220" height="62" rx="0"/>
<text class="text" x="880" y="2258">START</text>
<path class="edge" d="M880 2282 V2320"/>
<polygon class="decision" points="880,2320 1040,2390 880,2460 720,2390"/>
<text class="small" x="880" y="2382"><tspan x="880">Diagnostic antérieur</tspan><tspan x="880" dy="20">existant ?</tspan></text>

<!-- prior diagnostic yes -> modification since last diagnosis -->
<path class="edge" d="M1040 2390 H1190"/>
<text class="label" x="1100" y="2368">OUI</text>
<polygon class="decision" points="1350,2320 1500,2390 1350,2460 1200,2390"/>
<text class="small" x="1350" y="2382"><tspan x="1350">Modification depuis</tspan><tspan x="1350" dy="20">le dernier diagnostic ?</tspan></text>
<path class="edge" d="M1500 2390 H1600 V2730 H1460"/>
<text class="label" x="1535" y="2368">NON</text>

<!-- prior diagnostic no -> modification after date -->
<path class="edge" d="M880 2460 V2510"/>
<text class="label" x="900" y="2490">NON</text>
<polygon class="decision" points="880,2510 1040,2580 880,2650 720,2580"/>
<text class="small" x="880" y="2568"><tspan x="880">Modification après</tspan><tspan x="880" dy="20">le 30/04/2015 ?</tspan></text>

<!-- modification since last diagnostic yes -> 2 years? -->
<path class="edge" d="M1350 2460 V2510"/>
<text class="label" x="1370" y="2490">OUI</text>
<polygon class="decision" points="1350,2510 1500,2580 1350,2650 1200,2580"/>
<text class="small" x="1350" y="2568"><tspan x="1350">Au moins 2 ans</tspan><tspan x="1350" dy="20">depuis la modification ?</tspan></text>

<!-- modification after date yes -> merge to 2 years -->
<path class="edge" d="M1040 2580 H1120 V2580 H1200"/>
<text class="label" x="1090" y="2558">OUI</text>
<!-- modification after date no -> report question -->
<path class="edge" d="M880 2650 V2700"/>
<text class="label" x="900" y="2680">NON</text>
<polygon class="decision" points="880,2700 1040,2770 880,2840 720,2770"/>
<text class="small" x="880" y="2758"><tspan x="880">Diagnostic déjà</tspan><tspan x="880" dy="20">reporté ?</tspan></text>

<!-- 2 year no -> wait -->
<path class="edge" d="M1500 2580 H1580 V2660"/>
<text class="label" x="1530" y="2558">NON</text>
<rect class="yellow" x="1320" y="2660" width="330" height="150" rx="0"/>
<text class="small" x="1485" y="2700">
  <tspan x="1485" font-weight="700">Attendre le 1er contrôle</tspan>
  <tspan x="1485" dy="22">périodique après la période</tspan>
  <tspan x="1485" dy="22">de 2 ans pour effectuer</tspan>
  <tspan x="1485" dy="22">le diagnostic.</tspan>
</text>
<path class="edge" d="M1485 2810 V2860 H1190"/>

<!-- 2 years yes -> do diagnostic -->
<path class="edge" d="M1350 2650 V2690"/>
<text class="label" x="1370" y="2678">OUI</text>
<rect class="pink" x="1190" y="2690" width="260" height="92" rx="0"/>
<text class="text" x="1320" y="2728"><tspan x="1320">Effectuer un</tspan><tspan x="1320" dy="23">diagnostic approfondi</tspan></text>
<path class="edge" d="M1320 2782 V2860 H1190"/>

<!-- report yes -> do diagnostic -->
<path class="edge" d="M1040 2770 H1190"/>
<text class="label" x="1100" y="2748">OUI</text>
<path class="edge" d="M1190 2770 V2860"/>

<!-- report no -> perform, one postponement allowed -->
<path class="edge" d="M880 2840 V2890"/>
<text class="label" x="900" y="2870">NON</text>
<rect class="blue" x="690" y="2890" width="380" height="180" rx="0"/>
<text class="small" x="880" y="2925">
  <tspan x="880" font-weight="700">Effectuer le diagnostic.</tspan>
  <tspan x="880" dy="24">S’il n’est pas faisable, un seul report</tspan>
  <tspan x="880" dy="22">est toléré ; le diagnostic devra alors</tspan>
  <tspan x="880" dy="22">être réalisé lors du prochain contrôle</tspan>
  <tspan x="880" dy="22">périodique.</tspan>
  <tspan x="880" dy="26" font-weight="700">Un seul report est admis.</tspan>
</text>
<path class="edge" d="M1070 2980 H1190 V2860"/>

<!-- final in-order box and finish -->
<rect class="green" x="1120" y="2860" width="420" height="170" rx="0"/>
<text class="text" x="1330" y="2905">
  <tspan x="1330" font-weight="700">Installation déclarée en ordre</tspan>
  <tspan x="1330" dy="25">jusqu’à la prochaine inspection</tspan>
  <tspan x="1330" dy="25">périodique</tspan>
</text>
<path class="edge" d="M1330 3030 V3090 H1600"/>
<rect class="node" x="1600" y="3058" width="110" height="64" rx="0"/>
<text class="text" x="1655" y="3097">FIN</text>

<text x="95" y="3165" class="tiny">Source : « Modèle d’attestation de contrôle d’un générateur de chaleur », Gouvernement wallon, mise à jour du 29/10/2015.</text>
<text x="95" y="3190" class="tiny">Les intitulés, seuils et délais sont repris du document source. Les couleurs distinguent les situations décrites dans le logigramme d’origine.</text>
</g>
</svg>
